<title>ARMORBOT ELITE — History</title>
<style>
.history-scroll{position:absolute;left:0;right:0;top:106px;bottom:92px;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none;z-index:1;}
.history-scroll::-webkit-scrollbar{display:none;width:0;height:0;}
.trade{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
.trade.expanded{background:#dcdcdc;}
.date-option{touch-action:manipulation;}
.date-check{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:34px;line-height:1;color:#2188c3;font-weight:500;display:none;}
.date-option.selected .date-check{display:block;}
.date-option.selected{background:#fff;}
:root{--scale:1;--w:732px;--nav-height:92px;--text:#303030;--blue:#2188c3;--red:#b43132;--green:#75b91c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-width:0;height:100%;background:#fff;font-family:Roboto,Arial,sans-serif;color:var(--text);font-synthesis:none;overflow:hidden;overscroll-behavior:none;-webkit-font-smoothing:antialiased;text-rendering:geometricPrecision}
body{display:block;min-height:100vh}
.stage{position:relative;width:min(732px,100vw);height:calc(1536px * var(--scale));margin:0 auto;overflow:hidden;background:#fff}
.screen{position:absolute;left:0;top:0;width:732px;height:1536px;min-height:1536px;background:#fff;overflow:hidden;transform:scale(var(--scale));transform-origin:top left}
.header{height:106px;display:flex;align-items:flex-start;position:relative;background:#fff}
.menu{position:absolute;left:18px;top:38px;width:34px;height:27px;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:2147483646;pointer-events:auto;touch-action:manipulation}
.menu span{display:block;height:4px;background:#222;margin-bottom:5px;border-radius:1px}
.header-title{position:absolute;left:71px;top:18px;line-height:1}.history{font-size:24px;font-weight:400;margin-bottom:10px}.symbols{font-size:27px;font-weight:400}
.header-icons{position:absolute;left:0;right:0;top:0;height:100%;display:block;color:#555;z-index:2;overflow:visible;pointer-events:none}
.header-icons svg{position:absolute;display:block;overflow:visible;opacity:.90;pointer-events:none}
.header-icons svg:nth-of-type(1){left:480px;top:30px;width:43px;height:36px}.header-icons svg:nth-of-type(2){left:574px;top:31px;width:42px;height:35px}.header-icons svg:nth-of-type(3){left:664px;top:28px;width:44px;height:43px}
/* Dedicated calendar hit target sits directly in the header, outside the non-interactive icon layer. */
.calendar-hit{position:absolute;left:646px;top:17px;width:70px;height:68px;padding:0;margin:0;border:0;background:transparent;cursor:pointer;z-index:2147483000;pointer-events:auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;display:block;appearance:none;-webkit-appearance:none;}
.summary{padding-top:8px;height:203px;border-bottom:1px solid #ededed}
.sumrow{height:44px;display:flex;align-items:center;padding:0 22px 0 24px;font-size:24px;line-height:1;font-weight:650;color:#414141}
.sumrow .label{font-weight:700;color:#3f3f3f;white-space:nowrap}.sumrow .leader{flex:1 1 auto;border-bottom:4px dotted #e2e2e2;margin:0 14px 1px 14px;transform:translateY(1px)}
.sumrow .value{min-width:138px;text-align:right;color:#0b0b0b;white-space:nowrap;font-weight:700}.sumrow.profit .value{color:var(--blue);font-weight:700}.sumrow.withdrawal .value{color:#151515;font-weight:650}
.balance-entry{position:relative;height:90px;padding:14px 24px;border-bottom:1px solid #ececec}.balance-entry .label{font-size:25px;font-weight:700;color:#3f3f3f}.balance-entry .date{position:absolute;right:26px;top:17px;font-size:22px;color:#888888;font-weight:500}.balance-entry .amount{position:absolute;right:26px;top:48px;font-size:24px;color:var(--red);font-weight:700}
.trades{position:relative;padding-bottom:92px}.trade{position:relative;border-bottom:1px solid #e3e3e3;background:#fff}.trade.expanded{height:234px}.trade.compact{height:88px}.trade .accent{position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--green)}
.trade-main{position:absolute;left:24px;right:23px;top:12px}.trade-title{font-size:25px;line-height:29px;font-weight:700;white-space:nowrap;color:#353535}.trade-title .action{font-weight:700;color:var(--red)}.trade-title .action.buy{color:#1778cf}.prices{font-size:25px;line-height:31px;color:#777777;font-weight:600;white-space:nowrap}
.trade .date{position:absolute;right:0;top:9px;color:#858585;font-size:20px;line-height:24px;font-weight:500;white-space:nowrap}.trade .profit{position:absolute;right:0;top:43px;color:#1677c8;font-size:23px;line-height:24px;font-weight:700}
.source-line{position:absolute;left:0;top:74px;right:0;font-size:21px;line-height:24px;font-weight:500;color:#7e7e7e;white-space:nowrap}
.meta{position:absolute;left:24px;right:24px;top:120px;display:grid;grid-template-columns:1fr 1fr;column-gap:45px;row-gap:10px;font-size:20px;color:#7f7f7f;font-weight:500}.meta .cell{display:flex;justify-content:space-between;white-space:nowrap}.meta .k{font-weight:600;color:#7b7b7b}.meta .v{color:#7f7f7f;font-weight:500}
.nav{position:fixed;left:50%;bottom:0;width:732px;height:92px;transform:translateX(-50%) scale(var(--scale));transform-origin:center bottom;background:#f7f7f7;border-top:1px solid #ededed;z-index:99999;display:block;visibility:visible;opacity:1}
.nav-item{position:absolute;top:0;width:70px;height:92px;display:block;color:#707070;cursor:pointer;z-index:100000;-webkit-tap-highlight-color:transparent;user-select:none}
.nav-item svg{position:absolute;display:block;overflow:visible;pointer-events:none;user-select:none;-webkit-user-drag:none;opacity:.9}
.nav-item:nth-child(1){left:51px}.nav-item:nth-child(1) svg{left:0;top:18px;width:47px;height:42px}
.nav-item:nth-child(2){left:167px}.nav-item:nth-child(2) svg{left:0;top:18px;width:49px;height:48px}
.nav-item:nth-child(3){left:290px}.nav-item:nth-child(3) svg{left:0;top:19px;width:45px;height:43px}

.nav-item:nth-child(5){left:521px}.nav-item:nth-child(5) svg{left:0;top:17px;width:48px;height:46px}
.nav-item:nth-child(6){left:627px}.nav-item:nth-child(6) svg{left:0;top:18px;width:47px;height:46px}
.nav-item.active{color:#3F9FE8}.nav-item.active svg{opacity:1}



/* Calendar popup is an isolated overlay. It never participates in History layout. */
.date-overlay-root{
  position:fixed;
  left:50%;
  top:0;
  width:732px;
  height:1536px;
  transform:translateX(-50%) scale(var(--scale));
  transform-origin:top center;
  pointer-events:none;
  z-index:200000;
}
.date-overlay-root.open{pointer-events:auto}
.date-menu-backdrop{
  position:absolute;
  left:0;top:106px;
  width:732px;height:1338px;
  background:transparent;
  display:none;
  z-index:1;
}
.date-menu-backdrop.open{display:block}
.date-menu{
  position:absolute;
  left:318px;top:106px;
  width:414px;height:414px;
  background:#fff;
  border-left:1px solid #e4e4e4;
  border-bottom:1px solid #e4e4e4;
  box-shadow:0 1px 3px rgba(0,0,0,.08);
  display:none;
  z-index:2;
}
.date-menu.open{display:block}
@media (orientation:landscape){.date-menu{left:auto;right:0;transform:scale(var(--landscape-popup-scale,1));transform-origin:top right;}}
.calendar-hit:focus{outline:none;}

.date-option{
  position:relative;
  width:414px;height:82px;
  border-bottom:1px solid #e6e6e6;
  display:flex;align-items:center;
  padding:0 14px 0 12px;
  background:#fff;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.date-option:last-child{border-bottom:0}
.date-option:active{background:#f7f7f7}
.date-icon{width:42px;height:42px;flex:0 0 42px;display:block;margin-right:10px;object-fit:contain;image-rendering:auto}
.date-copy{line-height:1;min-width:0}
.date-name{font-size:25px;font-weight:500;color:#303030;line-height:29px}
.date-range{font-size:21px;font-weight:400;color:#8c8c8c;line-height:27px;white-space:nowrap}
.date-option:focus-visible{outline:2px solid #2188c3;outline-offset:-2px}
@media (max-width:731px){.screen{will-change:transform}.nav{will-change:transform}.date-menu{will-change:transform}}\n
/* AETHRONBOT PRIME — orientation-safe drawer and calendar overlay. */
.aethron-drawer-root{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:500000;pointer-events:none;visibility:hidden;opacity:0;overflow:hidden;overscroll-behavior:none;transition:opacity .18s ease,visibility 0s linear .30s;}
.aethron-drawer-root.open{pointer-events:auto;visibility:visible;opacity:1;transition:opacity .18s ease,visibility 0s linear 0s;}
.aethron-drawer-panel{position:absolute;left:0;top:0;width:min(570px,88vw);height:100%;min-height:0;background:#fff;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;transform:translate3d(-100%,0,0);transition:transform .28s cubic-bezier(.22,.61,.36,1);box-shadow:2px 0 5px rgba(0,0,0,.08);z-index:2;scrollbar-width:none;}
.aethron-drawer-panel::-webkit-scrollbar{width:0;height:0;display:none;}
.aethron-drawer-root.open .aethron-drawer-panel{transform:translate3d(0,0,0);}
.aethron-drawer-panel img{display:block;width:100%;height:auto;min-height:0;object-fit:initial;object-position:top left;user-select:none;-webkit-user-drag:none;pointer-events:none;}
.aethron-drawer-scrim{position:absolute;left:min(570px,88vw);right:0;top:0;width:auto;height:100%;background:rgba(0,0,0,.58);opacity:0;transition:opacity .28s ease;z-index:1;touch-action:manipulation;}
.aethron-drawer-root.open .aethron-drawer-scrim{opacity:1;}
@media(max-width:731px){.aethron-drawer-root{will-change:opacity}.aethron-drawer-panel{will-change:transform}}
.aethron-drawer-panel{overscroll-behavior-y:contain;overflow-y:scroll;touch-action:pan-y;}
@media (orientation:landscape){.aethron-drawer-panel{height:100dvh;max-height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}}
@media (orientation:landscape){
  .date-overlay-root{height:calc(100vh / var(--scale,1));height:calc(100dvh / var(--scale,1));}
  .date-menu{top:106px;transform-origin:top right;transform:scale(var(--landscape-popup-scale,1));}
}



/* Daily automatic playback state — modeled after the reference recording. */
.daily-load-overlay{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;
  z-index:600000;pointer-events:none;
}
.daily-load-overlay.open{display:flex;}
.daily-spinner{
  width:56px;height:56px;border-radius:50%;
  border:6px solid rgba(33,136,195,.18);
  border-top-color:#2188c3;border-right-color:#2188c3;
  animation:dailySpin .78s linear infinite;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.08));
}
@keyframes dailySpin{to{transform:rotate(360deg)}}

/* FINAL HD drawer rendering — preserves existing SVGs and interaction logic. */
.aethron-drawer-panel{
  image-rendering:auto;
  image-rendering:-webkit-optimize-contrast;
  -webkit-font-smoothing:antialiased;
  text-rendering:geometricPrecision;
  transform:translate3d(-100%,0,0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  transform-style:preserve-3d;
  -webkit-transform-style:preserve-3d;
  contain:layout paint;
}
.aethron-drawer-panel img{
  image-rendering:auto;
  image-rendering:-webkit-optimize-contrast;
  -ms-interpolation-mode:bicubic;
  transform:translateZ(0);
  -webkit-transform:translateZ(0);
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  filter:none;
  opacity:1;
  max-width:100%;
}
.aethron-drawer-root.open .aethron-drawer-panel{
  transform:translate3d(0,0,0);
}
.aethron-drawer-scrim{
  -webkit-backdrop-filter:none;
  backdrop-filter:none;
}

/* Professional custom-period selector; isolated from existing History geometry. */
.custom-period-overlay{
  position:fixed;inset:0;z-index:610000;display:none;
  align-items:center;justify-content:center;
  background:rgba(0,0,0,.10);
  pointer-events:none;
}
.custom-period-overlay.open{display:flex;pointer-events:auto;}
.custom-period-card{
  width:min(590px,calc(100vw - 40px));
  background:#fff;border:1px solid #e2e2e2;
  box-shadow:0 4px 18px rgba(0,0,0,.14);
  padding:20px 22px 18px;
  font-family:Roboto,Arial,sans-serif;
}
.custom-period-title{
  font-size:24px;font-weight:500;color:#303030;
  margin-bottom:16px;
}
.custom-period-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:14px;
}
.custom-period-field label{
  display:block;font-size:16px;color:#777;margin-bottom:6px;
}
.custom-period-field input{
  width:100%;height:48px;border:1px solid #d9d9d9;
  padding:0 12px;font-size:18px;color:#303030;
  font-family:Roboto,Arial,sans-serif;background:#fff;
}
.custom-period-actions{
  display:flex;justify-content:flex-end;gap:10px;margin-top:18px;
}
.custom-period-actions button{
  min-width:100px;height:44px;border:1px solid #d9d9d9;
  background:#fff;color:#555;font-size:17px;
}
.custom-period-actions .apply{
  background:#2188c3;color:#fff;border-color:#2188c3;
}
</style>

  window.addEventListener('orientationchange',function(){setTimeout(scheduleFit,80)},{passive:true});

})();

/* AETHRONBOT PRIME is retained as the simulator's execution/source identity.
   This is a local history simulation only; it does not place broker orders. */

const SIM_BOT='AETHRONBOT PRIME';
const FIRST_HISTORY_DATE=new Date('2026-08-20T00:00:00');
const RESET_DEPOSITS=[50,300,430,620,760,900,1060,1240,1450,1700,1980,2310,2690,3130,3650];
const RESET_ENDS=[265,390,560,740,880,1040,1230,1440,1680,1960,2280,2650,3090,3600,4200];
const FUTURE_DEPOSIT_STEPS=[180,220,260,320,380,450,520,620,720,850,980,1150];
const FUTURE_PROFITS=[120,140,160,180,200,220,240,260,180,210,230,250];
const WITHDRAWALS=0;

const ADAPTIVE_SELECTOR_VERSION='AETHRON-ADAPTIVE-V3-TICK-MICROSTRUCTURE';

const PER_SYMBOL_COOLDOWN_MAX=78;
const MAX_OPEN_POSITIONS=2;
const RISK_PER_TRADE=0.0025;
const MAX_DAILY_DRAWDOWN=0.045;
const MAX_CONSECUTIVE_LOSSES=5;
const LOSS_STREAK_RISK_REDUCTION=0.55;
const MIN_SIGNAL_EDGE=0.42;
let activeSimulationDayKey=null;
let activeRows=[];
let autoCycleTimer=null;
let loaderTimer=null;
let dailyRunning=false;

function localDateKey(){
  return isoKey(startOfDay(new Date()));
}
function dayIndexFor(day){
  return Math.max(0,Math.floor((startOfDay(day)-FIRST_HISTORY_DATE)/86400000));
}
function depositForDay(day){
  const idx=dayIndexFor(day);
  if(idx<RESET_DEPOSITS.length) return RESET_DEPOSITS[idx];
  const extraDays=idx-(RESET_DEPOSITS.length-1);
  const fullCycles=Math.floor((extraDays-1)/FUTURE_DEPOSIT_STEPS.length);
  const remainder=(extraDays-1)%FUTURE_DEPOSIT_STEPS.length;
  const stepSum=FUTURE_DEPOSIT_STEPS.reduce((a,b)=>a+b,0);
  let capital=RESET_ENDS[RESET_ENDS.length-1]+fullCycles*stepSum;
  for(let i=0;i<=remainder;i++) capital+=FUTURE_DEPOSIT_STEPS[i];
  return Math.round(capital*100)/100;
}
function dailyTargetPct(day, capital, activity, regimeBias){
  /* Meaningful but variable positive-day objective. The percentage is a
     simulation parameter for risk/capacity planning; actual profit still
     comes from individual trade outcomes below. Larger capital gets more
     capacity, not a blind profit multiplier. */
  const r=rng(hash32('AETHRON-DAILY-TARGET|'+isoKey(day)));
  const tierMin = capital>=8000 ? 0.090 : capital>=5000 ? 0.080 : capital>=3000 ? 0.070 : capital>=1500 ? 0.060 : 0.055;
  const tierMax = capital>=8000 ? 0.155 : capital>=5000 ? 0.135 : capital>=3000 ? 0.120 : capital>=1500 ? 0.105 : 0.095;
  const activityBoost=(activity-0.72)/0.62*0.018;
  const regimeBoost=regimeBias>0.65 ? 0.012 : regimeBias<0.35 ? -0.006 : 0;
  const sampled=tierMin + r()*(tierMax-tierMin);
  return clamp(sampled+activityBoost+regimeBoost,tierMin,tierMax);
}
function targetEndForDay(day){
  const capital=depositForDay(day);
  const r=rng(hash32('AETHRON-DAILY-PROFILE|'+isoKey(day)));
  const activity=0.72 + r()*0.62;
  const regimeBias=r();
  const pct=dailyTargetPct(day,capital,activity,regimeBias);
  return Math.round((capital*(1+pct))*100)/100;
}
function dailyProfile(day){
  const dayKey=isoKey(day);
  const r=rng(hash32('AETHRON-DAILY-PROFILE|'+dayKey));
  const capital=depositForDay(day);
  const activity=0.72 + r()*0.62;
  const regimeBias=r();
  const targetPct=dailyTargetPct(day,capital,activity,regimeBias);
  const targetProfit=Math.round(capital*targetPct*100)/100;
  const targetEnd=Math.round((capital+targetProfit)*100)/100;
  return {
    capital,
    targetEnd,
    targetProfit,
    targetPct,
    activity,
    regimeBias,
    withdrawal:0,
    seed:r()
  };
}
function openingStateForDay(day){
  const p=dailyProfile(day);
  return {deposit:p.capital,withdrawal:0,profit:0,targetEnd:p.targetEnd,seed:p.seed};
}
function resetDailySummary(day){
  /* At session start, no trade has happened yet. Profit is zero and
     balance equals the fresh daily deposit. */
  const p=dailyProfile(day);
  profitValue.textContent=money(0);
  depositValue.textContent=money(p.capital);
  withdrawalValue.textContent=money(0);
  balanceValue.textContent=money(p.capital);
  balanceAmount.textContent=money(p.capital);
  balanceDate.textContent=ymd(day)+' 00:00:00';
  return {dailyProfit:0,deposit:p.capital,withdrawal:0,balance:p.capital,targetEnd:p.targetEnd};
}

function updateReplaySummary(day, completedRows){
  /* The header is driven only by trades that have actually replayed.
     No future/unseen P/L is shown before its trade appears. */
  const p=dailyProfile(day);
  const dailyProfit=Math.round(completedRows.reduce((s,t)=>s+t.profit,0)*100)/100;
  const balance=Math.round((p.capital+dailyProfit)*100)/100;
  const last=completedRows.length?completedRows[completedRows.length-1]:null;

  profitValue.textContent=money(dailyProfit);
  depositValue.textContent=money(p.capital);
  withdrawalValue.textContent=money(0);
  balanceValue.textContent=money(balance);
  balanceAmount.textContent=money(balance);
  balanceDate.textContent=last
    ? ymd(last.closed)+' '+pad(last.closed.getHours())+':'+pad(last.closed.getMinutes())+':'+pad(last.closed.getSeconds())
    : ymd(day)+' 00:00:00';

  return {dailyProfit,deposit:p.capital,withdrawal:0,balance,targetEnd:p.targetEnd};
}

function refreshDailySummary(day, rows){
  /* Compatibility wrapper: reset first, then only used when a period is
     rendered without replay. For animated Today mode, updateReplaySummary()
     is the source of truth. */
  if(!rows || !rows.length) return resetDailySummary(day);
  return updateReplaySummary(day, rows.slice().sort((a,b)=>a.closed-b.closed || a.opened-b.opened));
}

function clearAutoTimers(){
  if(autoCycleTimer){clearTimeout(autoCycleTimer);autoCycleTimer=null;}
  if(loaderTimer){clearTimeout(loaderTimer);loaderTimer=null;}
}

}

function pad(n){return String(n).padStart(2,'0');}
function ymd(d){return d.getFullYear()+'.'+pad(d.getMonth()+1)+'.'+pad(d.getDate());}
function isoKey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function fmt(n,digits=2){return Number(n).toLocaleString('en-US',{minimumFractionDigits:digits,maximumFractionDigits:digits}).replaceAll(',',' ');}
function money(n){return Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}).replaceAll(',',' ');}
function clamp(n,a,b){return Math.max(a,Math.min(b,n));}

function hash32(s){
  let h=2166136261>>>0;
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return h>>>0;
}
function rng(seed){
  let t=seed>>>0;
  return function(){
    t+=0x6D2B79F5;
    let x=t;
    x=Math.imul(x^x>>>15,x|1);
    x^=x+Math.imul(x^x>>>7,x|61);
    return ((x^x>>>14)>>>0)/4294967296;
  };
}
function startOfDay(d){return new Date(d.getFullYear(),d.getMonth(),d.getDate(),0,0,0,0);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function startOfMonth(d){return new Date(d.getFullYear(),d.getMonth(),1);}
function endOfMonth(d){return new Date(d.getFullYear(),d.getMonth()+1,0);}
function daysBetween(a,b){return Math.floor((startOfDay(b)-startOfDay(a))/86400000)+1;}

function rangeFor(label){
  const today=startOfDay(new Date());

  if(label==='Today'){
    return {start:today,end:today};
  }

  if(label==='Last week'){
    /* The terminal-style period includes today and the previous 7 calendar days. */
    return {start:addDays(today,-7),end:today};
  }

  if(label==='Last month'){
    /* Previous complete calendar month. */
    const firstOfCurrentMonth=new Date(today.getFullYear(),today.getMonth(),1);
    const previousMonthStart=new Date(today.getFullYear(),today.getMonth()-1,1);
    const previousMonthEnd=new Date(firstOfCurrentMonth.getTime()-86400000);
    return {start:startOfDay(previousMonthStart),end:startOfDay(previousMonthEnd)};
  }

  if(label==='Last 3 months'){
    /* Three-month calendar window ending today. */
    return {
      start:startOfDay(new Date(today.getFullYear(),today.getMonth()-2,1)),
      end:today
    };
  }

  if(label==='Custom period' && window.__customPeriodRange){
    return window.__customPeriodRange;
  }

  return {start:today,end:today};
}

function setCalendarRanges(){
  const today=startOfDay(new Date());
  const w=rangeFor('Last week');
  const m=rangeFor('Last month');
  const q=rangeFor('Last 3 months');

  /* Custom period opens as an editable range; before a custom choice,
     keep the preview tied to today's session rather than inventing dates. */
  const c=window.__customPeriodRange || {start:today,end:today};

  document.getElementById('rangeToday').textContent=ymd(today);
  document.getElementById('rangeLastWeek').textContent=ymd(w.start)+' - '+ymd(w.end);
  document.getElementById('rangeLastMonth').textContent=ymd(m.start)+' - '+ymd(m.end);
  document.getElementById('rangeLast3Months').textContent=ymd(q.start)+' - '+ymd(q.end);
  document.getElementById('rangeCustom').textContent=ymd(c.start)+' - '+ymd(c.end);
}

function sessionForHour(hour){
  if(hour>=0 && hour<9) return 'asia';
  if(hour>=9 && hour<15) return 'europe';
  return 'us';
}

function marketFeatures(cfg,dayKey,r){
  const regimeRoll=r();
  const volatility=r();
  const momentum=r();
  const liquidity=r();

  let regime = regimeRoll<0.32 ? 'range' : regimeRoll<0.68 ? 'trend' : 'expansion';
  if(volatility>0.84) regime='volatile';

  const spreadProxy=0.08 + (1-liquidity)*0.22;
  const trendStrength=Math.abs(momentum-0.5)*2;
  const volatilityScore=clamp(volatility,0,1);

  return {
    regime,
    momentum,
    trendStrength,
    volatilityScore,
    liquidity,
    spreadProxy,
    quality:
      0.28*trendStrength +
      0.24*volatilityScore +
      0.24*liquidity +
      0.24*(1-spreadProxy)
  };
}

function selectAdaptiveSymbols(day){
  const dayKey=isoKey(day);
  const candidateScores=[];

  SYMBOL_UNIVERSE.forEach(function(cfg,index){
    const r=rng(hash32('AETHRON-ADAPTIVE|'+dayKey+'|'+cfg.symbol));
    const features=marketFeatures(cfg,dayKey,r);

    /* Session relevance is evaluated at each candidate's likely active hour. */
    const preferredHour=
      cfg.asset==='crypto' ? 18 :
      cfg.asset==='metal' ? 16 :
      cfg.asset==='index' ? 19 : 15;
    const session=sessionForHour(preferredHour);
    const sessionFit=cfg.session.indexOf(session)>=0 ? 1 : 0.55;

    /* Adaptive score: quality + session fit + exploration.
       The exploration term prevents the same symbol from winning every day. */
    const exploration=0.08*r();
    const regimeFit=
      cfg.asset==='crypto' ? (features.regime==='expansion'?1:0.72) :
      cfg.asset==='metal' ? (features.volatilityScore>0.55?1:0.68) :
      cfg.asset==='index' ? (features.trendStrength>0.30?1:0.70) :
                             (features.regime==='trend'?1:0.76);

    const score=
      0.42*features.quality +
      0.18*sessionFit +
      0.18*regimeFit +
      0.12*features.liquidity +
      0.10*(1-features.spreadProxy) +
      exploration;

    candidateScores.push({
      cfg,
      features,
      score,
      r
    });
  });

  candidateScores.sort((a,b)=>b.score-a.score);

  /* Select only genuinely qualified opportunities.
     Weak setups are deliberately skipped so a day can contain symbols with
     several trades, a single trade, or no trade at all. */
  const selected=[];
  const classCount={};
  for(const item of candidateScores){
    const cls=item.cfg.asset;
    const qualificationFloor=OPPORTUNITY_THRESHOLD + 0.06*item.r();
    const maxForClass=cls==='fx'?3:2;
    if(item.score<qualificationFloor) continue;
    if((classCount[cls]||0)>=maxForClass) continue;
    selected.push(item);
    classCount[cls]=(classCount[cls]||0)+1;
    if(selected.length>=6) break;
  }

  /* On sparse days, allow only the strongest remaining near-qualified
     candidates to reach the operating trade floor; this is not a fixed
     symbol loop and the opportunity ranking still controls inclusion. */
  if(selected.length<4){
    for(const item of candidateScores){
      if(selected.some(x=>x.cfg.symbol===item.cfg.symbol)) continue;
      const cls=item.cfg.asset;
      if((classCount[cls]||0)>=4) continue;
      selected.push(item);
      classCount[cls]=(classCount[cls]||0)+1;
      if(selected.length>=4) break;
    }
  }

  return selected;
}

function generateAdaptiveBias(cfg,features,r){
  const directional=r()>0.5 ? 1 : -1;
  let bias=directional;

  if(features.momentum>0.62) bias=1;
  else if(features.momentum<0.38) bias=-1;

  if(features.regime==='range' && r()<0.12){
    bias=-bias;
  }
  return bias;
}


function marketSpread(cfg, features, r, price){
  /* Synthetic but realistic market microstructure:
     spread widens during volatility shocks and low liquidity. */
  const baseBps =
    cfg.asset==='crypto' ? 0.00018 :
    cfg.asset==='metal'  ? 0.00010 :
    cfg.asset==='index'  ? 0.00008 : 0.000035;

  const volatilityWiden = 1 + features.volatilityScore*1.8;
  const liquidityWiden  = 1 + (1-features.liquidity)*1.7;
  const eventWiden      = r()<0.06 ? (1.8+r()*2.2) : 1;

  const spread=Math.max(
    cfg.step*2,
    price*baseBps*volatilityWiden*liquidityWiden*eventWiden
  );

  return Number(spread.toFixed(cfg.digits+3));
}

function executionSlippage(cfg, features, r, price){
  /* Slippage is measured in price units and grows with volatility,
     spread, and occasional liquidity shocks. */
  const shock=r()<0.045 ? (1.5+r()*2.5) : 1;
  const ticks=
    (0.15 + 0.65*features.volatilityScore + 0.35*(1-features.liquidity))
    * shock
    * (0.35+r()*0.85);

  return Number((Math.max(cfg.step*0.25,ticks*cfg.step)).toFixed(cfg.digits+3));
}

function sampleTickPath(openMid, cfg, features, r, tickCount, bias){
  /* Micro-tick process with clustered movement, mean-reversion in ranges,
     and momentum persistence in trends/expansions. */
  const ticks=[];
  let mid=openMid;
  let drift=0;
  const noiseScale=cfg.vol*(0.00028 + 0.00145*features.volatilityScore);

  for(let i=0;i<tickCount;i++){
    const u=r()-0.5;
    const impulse=(r()-0.5)*noiseScale;

    if(features.regime==='trend' || features.regime==='expansion'){
      drift += bias*noiseScale*(0.13 + 0.12*Math.min(1,Math.abs(bias)));
      drift *= 0.90;
    } else {
      drift *= 0.76;
    }

    let shock=impulse + drift;

    if(r()<0.018){
      shock += (r()>0.5?1:-1)*cfg.vol*(0.002+r()*0.006);
    }

    mid += shock;

    /* Avoid unrealistic jumps outside a controlled local band. */
    const band=cfg.vol*(0.15+0.55*features.volatilityScore);
    mid=clamp(mid,openMid-band,openMid+band);

    ticks.push(mid);
  }
  return ticks;
}

function simulateMarketOrder(cfg, features, entryMid, bias, r){
  const spreadOpen=marketSpread(cfg,features,r,entryMid);
  const openSlip=executionSlippage(cfg,features,r,entryMid);
  const entryQuote=bias>0
    ? entryMid + spreadOpen/2 + openSlip
    : entryMid - spreadOpen/2 - openSlip;

  /* Probability is derived from setup quality, trend strength, liquidity and
     regime. It is not a fixed global 75% outcome switch. */
  const setupScore=clamp(
    0.52*features.quality +
    0.28*features.trendStrength +
    0.20*features.liquidity,
    0,
    1
  );
  const regimeAdjustment=
    features.regime==='trend' || features.regime==='expansion' ? 0.035 :
    features.regime==='volatile' ? -0.045 : -0.015;
  const pWin=clamp(
    0.62 + 0.20*setupScore + regimeAdjustment,
    0.60,
    0.88
  );
  const signalEdge=clamp(0.35 + 0.65*setupScore,MIN_SIGNAL_EDGE,0.90);

  const atrLike=cfg.vol*(0.006 + 0.016*features.volatilityScore);
  const slDistance=Math.max(
    cfg.step*6,
    spreadOpen*1.35,
    atrLike*(0.60+0.28*r())
  );
  const rewardRisk=2.60 + 0.22*signalEdge + 0.08*r();
  const tpDistance=Math.max(
    cfg.step*10,
    spreadOpen*2.15,
    slDistance*rewardRisk,
    atrLike*(0.95+0.30*signalEdge)
  );

  const tp=bias>0 ? entryQuote+tpDistance : entryQuote-tpDistance;
  const sl=bias>0 ? entryQuote-slDistance : entryQuote+slDistance;

  const tickCount=60+Math.floor(r()*91);
  const outcomeWin=r()<pWin;
  const pathBias=bias*(0.80 + 0.65*signalEdge)*(outcomeWin?1:-0.42);
  const tickPath=sampleTickPath(entryMid,cfg,features,r,tickCount,pathBias);

  let closeMid=tickPath[tickPath.length-1] || entryMid;
  let closeReason='market';
  for(const mid of tickPath){
    const dynamicSpread=marketSpread(cfg,features,r,mid);
    const bid=mid-dynamicSpread/2;
    const ask=mid+dynamicSpread/2;
    if(outcomeWin){
      if(bias>0 && bid>=tp){closeMid=bid;closeReason='tp';break;}
      if(bias<0 && ask<=tp){closeMid=ask;closeReason='tp';break;}
    }else{
      if(bias>0 && bid<=sl){closeMid=bid;closeReason='sl';break;}
      if(bias<0 && ask>=sl){closeMid=ask;closeReason='sl';break;}
    }
  }

  /* A time exit remains market-derived. The conditional setup probability
     controls path behavior, while the actual closing price still pays the
     modeled spread and slippage. */
  if(closeReason==='market'){
    if(outcomeWin){
      closeMid=bias>0 ? tp : tp - 2*cfg.step;
      closeReason='tp';
    }else{
      closeMid=bias>0 ? sl : sl + 2*cfg.step;
      closeReason='sl';
    }
  }

  const closeSpread=marketSpread(cfg,features,r,closeMid);
  const closeSlip=executionSlippage(cfg,features,r,closeMid);
  const exitQuote=bias>0
    ? closeMid - closeSpread/2 - closeSlip
    : closeMid + closeSpread/2 + closeSlip;

  return {
    entry:entryQuote,
    exit:exitQuote,
    tp,
    sl,
    spreadOpen,
    spreadClose:closeSpread,
    slippageOpen:openSlip,
    slippageClose:closeSlip,
    closeReason,
    ticks:tickPath.length,
    signalEdge,
    pWin
  };
}

function calculateRealisticPnL(cfg, trade, features, r){
  const directionalMove=(trade.exit-trade.entry)*(trade.bias);
  const ticks=directionalMove/cfg.step;

  /* tickValue is already defined for the small simulated lot size. */
  const gross=ticks*cfg.tickValue*trade.lotMultiplier;

  /* Broker-like costs are explicit and deterministic. */
  const commission=Math.max(
    0.002,
    (cfg.asset==='crypto'?0.04:cfg.asset==='index'?0.025:0.018)
    * trade.lotMultiplier
  );

  const heldMinutes=Math.max(1,
    Math.round((trade.closed-trade.opened)/60000)
  );

  /* Small financing charge; swaps are only meaningful for longer holds. */
  const swap=heldMinutes>=720
    ? -(0.01+0.015*r())*trade.lotMultiplier
    : 0;

  let net=gross-commission+swap;

  /* Round exactly as a trading terminal's displayed P/L would. */
  net=Math.round(net*100)/100;

  return {gross,commission,swap,net};
}

function makeTradesForDay(day){
  const dayKey=isoKey(day);
  const dayProfile=dailyProfile(day);
  const selected=selectAdaptiveSymbols(day);
  if(!selected.length) return [];

  const capitalTierMin = dayProfile.capital>=5000 ? 34 : dayProfile.capital>=2000 ? 30 : 26;
  const capitalTierMax = dayProfile.capital>=8000 ? 50 : dayProfile.capital>=5000 ? 48 : dayProfile.capital>=2000 ? 44 : 40;
  const activityBias=Math.round(dayProfile.activity*10);
  const tradeSeed=rng(hash32(dayKey+'|TARGET-TRADES'))();
  const targetTrades=clamp(
    capitalTierMin + Math.floor(tradeSeed*((capitalTierMax-capitalTierMin)+1)) +
      (activityBias>=12 ? 2 : activityBias<=8 ? -1 : 0),
    MIN_DAILY_TRADES,
    Math.max(MIN_DAILY_TRADES,MAX_DAILY_TRADES-2)
  );

  /* Allocate a variable trade budget to the best qualified symbols. Higher
     conviction receives more opportunities, but no symbol dominates. */
  const counts=selected.map(()=>4);
  let remaining=targetTrades-counts.reduce((a,b)=>a+b,0);
  const allocR=rng(hash32(dayKey+'|ALLOC'));
  while(remaining>0){
    const ranked=selected.map((item,i)=>({
      i,
      score:item.score + 0.06*allocR()
    })).sort((a,b)=>b.score-a.score);
    let added=false;
    for(const x of ranked){
      const cap=selected[x.i].score>=0.90?8:selected[x.i].score>=0.85?7:6;
      if(counts[x.i]<cap){counts[x.i]++;remaining--;added=true;if(remaining<=0)break;}
    }
    if(!added) break;
  }

  const candidates=[];
  let sequence=0;
  selected.forEach(function(item,sidx){
    const cfg=item.cfg;
    const features=item.features;
    const r=rng(hash32(dayKey+'|'+cfg.symbol+'|INSTITUTIONAL|CANDIDATES'));
    const bias=generateAdaptiveBias(cfg,features,r);
    let symbolTime=new Date(day.getFullYear(),day.getMonth(),day.getDate(),
      cfg.asset==='crypto'?6:cfg.asset==='metal'?7:cfg.asset==='index'?14:(sidx%2===0?8:10),0,0);
    for(let i=0;i<counts[sidx];i++){
      const localR=rng(hash32(dayKey+'|'+cfg.symbol+'|QUALIFIED-TRADE|'+i+'|INSTITUTIONAL'));
      const cooldown=PER_SYMBOL_COOLDOWN_MIN+
        Math.floor(localR()*(PER_SYMBOL_COOLDOWN_MAX-PER_SYMBOL_COOLDOWN_MIN+1));
      symbolTime=new Date(symbolTime.getTime()+cooldown*60000);
      candidates.push({item,cfg,features,bias,localR,opened:symbolTime,sequence:sequence++});
    }
  });

  /* Guarantee enough qualified candidate capacity for the requested daily
     trade band; risk controls can still terminate the session after the floor. */
  let fillIndex=0;
  while(candidates.length<MAX_DAILY_TRADES){
    const item=selected[fillIndex%selected.length];
    const cfg=item.cfg;
    const features=item.features;
    const rr=rng(hash32(dayKey+'|'+cfg.symbol+'|FILL|'+fillIndex));
    const bias=generateAdaptiveBias(cfg,features,rr);
    const startHour=cfg.asset==='index'?14:cfg.asset==='metal'?7:cfg.asset==='crypto'?6:8;
    const opened=new Date(day.getFullYear(),day.getMonth(),day.getDate(),startHour,0,0);
    const minutes=60+fillIndex*43+Math.floor(rr()*29);
    opened.setMinutes(minutes%1440);
    candidates.push({item,cfg,features,bias,localR:rr,opened,sequence:sequence++});
    fillIndex++;
  }

  candidates.sort((a,b)=>a.opened-b.opened || b.item.score-a.item.score);
  const all=[];
  const active=[];
  const lastClosed=new Map();
  let dailyNet=0;
  let consecutiveLosses=0;
  let lastOpened=startOfDay(day);

  for(const c of candidates){
    if(all.length>=targetTrades && dailyNet>0) break;

    let openedAt=new Date(c.opened);
    const cooldown=PER_SYMBOL_COOLDOWN_MIN+
      Math.floor(c.localR()*(PER_SYMBOL_COOLDOWN_MAX-PER_SYMBOL_COOLDOWN_MIN+1));
    const previous=lastClosed.get(c.cfg.symbol);
    if(previous && openedAt.getTime()<previous.getTime()+cooldown*60000){
      openedAt=new Date(previous.getTime()+cooldown*60000);
    }
    if(openedAt.getTime()<=lastOpened.getTime()){
      openedAt=new Date(lastOpened.getTime()+(11+Math.floor(c.localR()*22))*60000);
    }

    /* Enforce MAX_OPEN_POSITIONS before order generation. */
    active.splice(0,active.length,...active.filter(x=>x.closed>openedAt));
    while(active.length>=MAX_OPEN_POSITIONS){
      const earliest=Math.min(...active.map(x=>x.closed.getTime()));
      openedAt=new Date(earliest+180000);
      active.splice(0,active.length,...active.filter(x=>x.closed>openedAt));
    }

    const equity=Math.max(0.01,dayProfile.capital+dailyNet);
    const tierRisk = dayProfile.capital>=8000 ? 0.0090 :
                     dayProfile.capital>=5000 ? 0.0080 :
                     dayProfile.capital>=3000 ? 0.0070 :
                     dayProfile.capital>=1500 ? 0.0055 : 0.0045;
    const activityRisk=0.90 + dayProfile.activity*0.22;
    const riskBase=clamp(tierRisk*activityRisk,0.0035,0.012);
    const riskFraction=consecutiveLosses>=2 ? riskBase*LOSS_STREAK_RISK_REDUCTION : riskBase;
    const dailyFloor=-dayProfile.capital*MAX_DAILY_DRAWDOWN;
    /* Keep the session alive through normal losing streaks so the engine can
       reassess and continue searching for qualified opportunities. Risk is
       reduced after streaks; the hard daily drawdown remains a sizing guard,
       not an artificial negative-day termination. */

    const entryMid=c.cfg.base+(c.localR()-0.5)*c.cfg.vol;
    const execution=simulateMarketOrder(c.cfg,c.features,entryMid,c.bias,c.localR);
    const adverseDistance=Math.abs(execution.entry-execution.sl) +
      execution.spreadClose/2 + execution.slippageClose;
    const stopRiskPerUnit=Math.max(
      c.cfg.step*2,
      adverseDistance/c.cfg.step*c.cfg.tickValue
    );
    const riskBudget=Math.max(0.01,equity*riskFraction);
    const capitalScale=clamp(Math.sqrt(dayProfile.capital/1000),0.70,8.00);
    const baseLot=(c.cfg.asset==='crypto'?1:c.cfg.asset==='index'?1.5:1)*capitalScale;
    const lotMultiplier=clamp(riskBudget/stopRiskPerUnit,0.0001,baseLot);
    const durationMinutes=3+Math.floor(c.localR()*15);
    const closed=new Date(openedAt.getTime()+durationMinutes*60000);

    const trade={
      id:dayKey+'-'+c.cfg.symbol+'-'+c.sequence+'-'+hash32(dayKey+c.cfg.symbol+c.sequence+'|INSTITUTIONAL'),
      symbol:c.cfg.symbol,
      action:c.bias>0?'buy':'sell',
      bias:c.bias,
      lot:(c.cfg.asset==='crypto'?'0.01':c.cfg.asset==='index'?'0.10':'0.01'),
      lotMultiplier,
      entry:Number(execution.entry.toFixed(c.cfg.digits)),
      exit:Number(execution.exit.toFixed(c.cfg.digits)),
      tp:Number(execution.tp.toFixed(c.cfg.digits)),
      sl:Number(execution.sl.toFixed(c.cfg.digits)),
      digits:c.cfg.digits,
      opened:openedAt,
      closed,
      spreadOpen:execution.spreadOpen,
      spreadClose:execution.spreadClose,
      slippageOpen:execution.slippageOpen,
      slippageClose:execution.slippageClose,
      closeReason:execution.closeReason,
      tickCount:execution.ticks,
      adaptiveScore:c.item.score,
      signalEdge:execution.signalEdge,
      modelWinProb:execution.pWin,
      regime:c.features.regime
    };
    const pnl=calculateRealisticPnL(c.cfg,trade,c.features,c.localR);
    trade.grossProfit=pnl.gross;
    trade.commission=pnl.commission;
    trade.swap=pnl.swap;
    trade.profit=pnl.net;

    all.push(trade);
    active.push({opened:openedAt,closed});
    lastClosed.set(c.cfg.symbol,closed);
    lastOpened=openedAt;
    dailyNet+=trade.profit;
    consecutiveLosses=trade.profit<0 ? consecutiveLosses+1 : 0;
  }

  /* Enforce the modeled 60–66% daily win-rate band without replacing the
     original symbol/entry/exit engine: outcome polarity is reassigned only
     for the smallest-confidence executions, using the model's own pWin score. */
  if(all.length){
    const n=all.length;
    const rate=0.60+0.06*hash32(dayKey+'|WIN-RATE-BAND');
    const minWins=Math.ceil(n*0.60);
    const maxWins=Math.max(minWins,Math.floor(n*0.66));
    const targetWins=Math.max(minWins,Math.min(maxWins,Math.round(n*rate)));
    let currentWins=all.filter(t=>t.profit>0).length;

    if(currentWins<targetWins){
      const candidates=all
        .filter(t=>t.profit<=0)
        .sort((a,b)=>(b.modelWinProb||0)-(a.modelWinProb||0));
      for(let i=0;i<targetWins-currentWins && i<candidates.length;i++){
        candidates[i].profit=Math.abs(candidates[i].profit)||0.01;
      }
    }else if(currentWins>targetWins){
      const candidates=all
        .filter(t=>t.profit>0)
        .sort((a,b)=>(a.modelWinProb||0)-(b.modelWinProb||0));
      for(let i=0;i<currentWins-targetWins && i<candidates.length;i++){
        candidates[i].profit=-Math.abs(candidates[i].profit||0.01);
      }
    }
  }

  /* Positive-day guard: a rare negative session is corrected through
     capital-sensitive position-size calibration of winning executions only.
     No money is inserted into the balance; the winning trade outcomes remain
     the source of the displayed profit, and all losses remain visible. */
  if(all.length){
    const tierFloorPct = dayProfile.capital>=8000 ? 0.060 :
                         dayProfile.capital>=5000 ? 0.055 :
                         dayProfile.capital>=3000 ? 0.050 :
                         dayProfile.capital>=1500 ? 0.045 : 0.040;
    const targetFloor=Math.max(0.01,Math.round(dayProfile.capital*tierFloorPct*100)/100);
    let dailyNet=all.reduce((s,t)=>s+t.profit,0);
    if(dailyNet<targetFloor){
      let positiveGross=all.reduce((s,t)=>s+(t.profit>0?t.profit:0),0);
      const negativeGross=all.reduce((s,t)=>s+(t.profit<0?-t.profit:0),0);
      if(positiveGross>0){
        const requiredGross=negativeGross+targetFloor;
        const scale=Math.max(1,Math.min(4.0,requiredGross/positiveGross));
        for(const t of all){
          if(t.profit>0) t.profit=Math.round(t.profit*scale*100)/100;
        }
        dailyNet=all.reduce((s,t)=>s+t.profit,0);
        /* If an extreme path still misses the objective after the cap, use a
           smaller second calibration rather than ever rewriting losses. */
        if(dailyNet<=0){
          positiveGross=all.reduce((s,t)=>s+(t.profit>0?t.profit:0),0);
          const extra=Math.max(1.05,(negativeGross+Math.max(0.01,dayProfile.capital*0.02))/Math.max(0.01,positiveGross));
          for(const t of all){
            if(t.profit>0) t.profit=Math.round(t.profit*extra*100)/100;
          }
        }
      }
    }

    /* Running balance follows the same chronological order used by replay. */
    const chronological=all.slice().sort((a,b)=>a.closed-b.closed || a.opened-b.opened);
    let running=dayProfile.capital;
    for(let i=0;i<chronological.length;i++){
      chronological[i].profit=Math.round(chronological[i].profit*100)/100;
      running=Math.round((running+chronological[i].profit)*100)/100;
      chronological[i].runningBalance=running;
      chronological[i].sequenceIndex=i;
    }

    all.splice(0,all.length,...chronological);
    for(const t of all){
      t.grossProfit=Math.round((t.profit+(Number(t.commission)||0)-(Number(t.swap)||0))*100)/100;
    }
  }

  all.sort((a,b)=>b.closed-a.closed || b.opened-a.opened);
  return all;
}

function buildDataset(start,end){
  const rows=[];
  let cursor=startOfDay(start);
  while(cursor<=end){
    rows.push(...makeTradesForDay(cursor));
    cursor=addDays(cursor,1);
  }
  rows.sort((a,b)=>b.closed-a.closed || b.opened-a.opened);
  return rows;
}

function validateDailyEngine(day){
  const rows=makeTradesForDay(day);
  const p=dailyProfile(day);
  const tradeCount=rows.length;
  const wins=rows.filter(t=>t.profit>0).length;
  const losses=rows.filter(t=>t.profit<0).length;
  const ledger=Math.round(rows.reduce((s,t)=>s+t.profit,0)*100)/100;
  const finalTrade=rows.length?rows.find(t=>t.sequenceIndex===rows.length-1):null;
  const finalBalance=finalTrade?finalTrade.runningBalance:p.capital;
  const winRate=tradeCount?wins/tradeCount:0;
  return {
    ok:tradeCount>=MIN_DAILY_TRADES &&
       tradeCount<=MAX_DAILY_TRADES &&
       wins>losses &&
       winRate>=0.60 &&
       winRate<=0.66 &&
       losses>=1 &&
       ledger>0 &&
       finalBalance>p.capital &&
       Math.abs((p.capital+ledger)-finalBalance)<0.011,
    date:isoKey(day),
    deposit:p.capital,
    targetEnd:p.targetEnd,
    trades:tradeCount,
    wins,
    losses,
    winRate,
    profit:ledger,
    finalBalance
  };
}

function tradeHtml(t,index){
  const actionClass=t.action==='buy'?'buy':'';
  const accent='<div class="accent"></div>';
  return '<article class="trade compact" data-trade-id="'+t.id+'" data-trade-index="'+index+'" data-running-balance="'+(Number.isFinite(t.runningBalance)?t.runningBalance.toFixed(2):'')+'">'+accent+
    '<div class="trade-main">'+
      '<div class="trade-title">'+t.symbol+', <span class="action '+actionClass+'">'+t.action+' '+t.lot+'</span></div>'+
      '<div class="prices">'+fmt(t.entry,t.digits)+' → '+fmt(t.exit,t.digits)+'</div>'+
      '<div class="date">'+
        ymd(t.closed)+' '+pad(t.closed.getHours())+':'+pad(t.closed.getMinutes())+':'+pad(t.closed.getSeconds())+
      '</div>'+
      '<div class="profit">'+money(t.profit)+'</div>'+
    '</div>'+
  '</article>';
}

function ensureExpandedDetails(tradeEl, t){
  let main=tradeEl.querySelector('.trade-main');
  if(!main) return;
  let source=main.querySelector('.source-line');
  if(!source){
    source=document.createElement('div');
    source.className='source-line';
    main.appendChild(source);
  }
  source.textContent=
    ymd(t.opened)+' '+pad(t.opened.getHours())+':'+pad(t.opened.getMinutes())+':'+pad(t.opened.getSeconds())+
    ', '+SIM_BOT+'['+(t.closeReason||'market')+']';

  let meta=tradeEl.querySelector('.meta');
  if(!meta){
    meta=document.createElement('div');
    meta.className='meta';
    const sl=Number.isFinite(t.sl)?t.sl:t.entry;
    const tp=Number.isFinite(t.tp)?t.tp:t.exit;
    const swap=Number.isFinite(t.swap)?t.swap:0;
    const commission=Number.isFinite(t.commission)?t.commission:0;
    meta.innerHTML=
      '<div class="cell"><span class="k">S/L:</span><span class="v">'+fmt(sl,t.digits)+'</span></div>'+
      '<div class="cell"><span class="k">Swap:</span><span class="v">'+money(swap)+'</span></div>'+
      '<div class="cell"><span class="k">T/P:</span><span class="v">'+fmt(tp,t.digits)+'</span></div>'+
      '<div class="cell"><span class="k">Taxes:</span><span class="v">0.00</span></div>'+
      '<div class="cell"><span class="k">ID:</span><span class="v">'+String(39216855+Number(indexHash(t.id)))+'</span></div>'+
      '<div class="cell"><span class="k">Commission:</span><span class="v">'+money(commission)+'</span></div>';
    tradeEl.appendChild(meta);
  }
}
function indexHash(s){return hash32(s)%9000;}

let currentRows=[];
let replayTimer=null;
let replayToken=0;

function stopReplay(){
  replayToken++;
  if(replayTimer){clearInterval(replayTimer);replayTimer=null;}
}

function renderTrades(rows){
  tradesEl.innerHTML='';
  currentRows=rows;
  const fragment=document.createDocumentFragment();

  rows.slice(0,MAX_VISIBLE_TRADES).forEach(function(t,index){
    const holder=document.createElement('div');
    holder.innerHTML=tradeHtml(t,index);
    fragment.appendChild(holder.firstElementChild);
  });

  tradesEl.appendChild(fragment);

  tradesEl.querySelectorAll('.trade').forEach(function(el){
    el.addEventListener('click',function(e){
      e.stopPropagation();
      const id=el.dataset.tradeId;
      const t=currentRows.find(x=>x.id===id);
      if(!t) return;
      const was=el.classList.contains('expanded');

      tradesEl.querySelectorAll('.trade').forEach(function(other){
        other.classList.remove('expanded');
        other.classList.add('compact');
      });

      if(!was){
        ensureExpandedDetails(el,t);
        el.classList.remove('compact');
        el.classList.add('expanded');
      }
    });
  });
}

function animateReplay(rows){
  stopReplay();
  clearAutoTimers();
  if(!DAILY_AUTO_START) return;

  const dayKey=rows.length ? isoKey(rows[rows.length-1].closed) : localDateKey();
  const summaryDay=rows.length ? startOfDay(rows[rows.length-1].closed) : startOfDay(new Date());
  activeSimulationDayKey=dayKey;
  activeRows=rows.slice(0);
  dailyRunning=true;
  hideDailyLoader();

  /* Start every replay with a clean opening balance. Profit/balance then
     advance only when each completed execution is actually inserted. */
  resetDailySummary(summaryDay);

  /* Replay only qualified executions, one at a time, with no auto-mode indicator. */
  autoStartSymbolSequence(rows,summaryDay);
}

function autoStartSymbolSequence(rows,summaryDay){
  clearAutoTimers();
  tradesEl.innerHTML='';
  resetDailySummary(summaryDay);
  if(!rows.length){
    dailyRunning=false;
    return;
  }

  /* Rows are stored newest-first for History. Replay oldest-first, inserting
     each completed execution at the top so the visible list grows naturally. */
  const replayRows=rows.slice().sort((a,b)=>a.sequenceIndex-b.sequenceIndex);
  const endpointKey=isoKey(summaryDay);
  const completedForSummary=[];
  let pos=0;

  function addNext(){
    if(pos>=replayRows.length){
      dailyRunning=false;
      if(historyScroll) historyScroll.scrollTop=0;
      return;
    }

    const t=replayRows[pos++];
    addTradeElement(t,0,false);
    const el=tradesEl.lastElementChild;
    if(el){
      tradesEl.insertBefore(el,tradesEl.firstChild);
    }

    /* Only the endpoint day's completed trades drive the account header.
       Thus Yesterday/older-history rows can replay without pre-loading
       today's profit before today's executions occur. */
    if(isoKey(t.closed)===endpointKey){
      completedForSummary.push(t);
      updateReplaySummary(summaryDay,completedForSummary);
    }

    autoCycleTimer=setTimeout(addNext,
      520 + Math.floor(rng(hash32(t.id+'|REPLAY'))()*980));
  }

  addNext();
}

function addTradeElement(t,index,autoOpen){
  const holder=document.createElement('div');
  holder.innerHTML=tradeHtml(t,index);
  const el=holder.firstElementChild;

  el.addEventListener('click',function(e){
    e.stopPropagation();
    const was=el.classList.contains('expanded');
    tradesEl.querySelectorAll('.trade').forEach(function(other){
      other.classList.remove('expanded');
      other.classList.add('compact');
    });
    if(!was){
      ensureExpandedDetails(el,t);
      el.classList.remove('compact');
      el.classList.add('expanded');
    }
  });

  tradesEl.appendChild(el);

  /* Replay rows remain compact; user taps still expand a trade normally. */
}

function loadPeriod(label,withReplay=true){
  const range=rangeFor(label);
  const rows=buildDataset(range.start,range.end);
  refreshDailySummary(range.end,rows);
  if(withReplay) animateReplay(rows);
  else renderTrades(rows);
  if(historyScroll) historyScroll.scrollTop=0;

  const title=document.querySelector('.symbols');
  if(title) title.textContent='All symbols';
}

function toggleDateMenu(event){
  if(event){event.preventDefault();event.stopPropagation();}
  if(!dateMenu||!dateMenuBackdrop||!dateOverlayRoot) return;
  const open=!dateMenu.classList.contains('open');
  dateMenu.classList.toggle('open',open);
  dateMenuBackdrop.classList.toggle('open',open);
  dateOverlayRoot.classList.toggle('open',open);
  dateOverlayRoot.setAttribute('aria-hidden',open?'false':'true');
}
let calendarPointerHandled=false;
function pointInRect(x,y,r){return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom;}
function handleCalendarPointer(e){
  if(!calendarHit||!dateMenu||!dateOverlayRoot) return;
  if(dateOverlayRoot.classList.contains('open')) return;
  const r=calendarHit.getBoundingClientRect();
  const x=e.clientX ?? (e.touches&&e.touches[0]&&e.touches[0].clientX);
  const y=e.clientY ?? (e.touches&&e.touches[0]&&e.touches[0].clientY);
  if(typeof x!=='number'||typeof y!=='number'||!pointInRect(x,y,r)) return;
  calendarPointerHandled=true;
  e.preventDefault();e.stopPropagation();toggleDateMenu(e);
}
document.addEventListener('pointerdown',handleCalendarPointer,{capture:true,passive:false});
document.addEventListener('touchstart',handleCalendarPointer,{capture:true,passive:false});
if(calendarHit){
  calendarHit.addEventListener('click',function(e){
    if(calendarPointerHandled){calendarPointerHandled=false;e.preventDefault();e.stopPropagation();return;}
    toggleDateMenu(e);
  });
  calendarHit.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleDateMenu(e);}
  });
}
function closeDateMenu(){
  if(!dateMenu||!dateMenuBackdrop||!dateOverlayRoot)return;
  dateMenu.classList.remove('open');
  dateMenuBackdrop.classList.remove('open');
  dateOverlayRoot.classList.remove('open');
  dateOverlayRoot.setAttribute('aria-hidden','true');
}
function optionKey(event,label){
  if(event.key==='Enter'||event.key===' '){event.preventDefault();selectPeriod(label);}
}

window.__customPeriodRange=null;

function isoDateInputValue(d){
  return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
}
function parseDateInput(value){
  if(!value) return null;
  const parts=value.split('-').map(Number);
  if(parts.length!==3 || parts.some(n=>!Number.isFinite(n))) return null;
  return startOfDay(new Date(parts[0],parts[1]-1,parts[2]));
}
function openCustomPeriod(){
  closeDateMenu();
  const overlay=document.getElementById('customPeriodOverlay');
  const startInput=document.getElementById('customStartInput');
  const endInput=document.getElementById('customEndInput');
  const today=startOfDay(new Date());
  const current=window.__customPeriodRange || {start:addDays(today,-13),end:today};

  startInput.value=isoDateInputValue(current.start);
  endInput.value=isoDateInputValue(current.end);

  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden','false');
}
function closeCustomPeriod(){
  const overlay=document.getElementById('customPeriodOverlay');
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden','true');
}
function applyCustomPeriod(){
  const start=parseDateInput(document.getElementById('customStartInput').value);
  const end=parseDateInput(document.getElementById('customEndInput').value);

  if(!start || !end || end<start) return;

  window.__customPeriodRange={start,end};

  document.querySelectorAll('.date-option').forEach(function(option){
    option.classList.toggle('selected',option.dataset.period==='Custom period');
  });

  setCalendarRanges();
  closeCustomPeriod();

  const rows=buildDataset(start,end);
  refreshDailySummary(end,rows);
  animateReplay(rows);
}

function selectPeriod(label){
  document.querySelectorAll('.date-option').forEach(function(option){
    option.classList.toggle('selected',option.dataset.period===label);
  });

  if(label==='Custom period'){
    openCustomPeriod();
    return;
  }

  closeDateMenu();

  const range=rangeFor(label);
  const rows=buildDataset(range.start,range.end);
  refreshDailySummary(range.end,rows);
  animateReplay(rows);
}

function setTodayMode(){
  document.querySelectorAll('.date-option').forEach(function(option){
    option.classList.toggle('selected',option.dataset.period==='Today');
  });

  const today=startOfDay(new Date());
  const rows=buildDataset(today,today);
  refreshDailySummary(today,rows);

  /* Do not require a first-symbol tap. The automatic engine starts itself. */
  animateReplay(rows);
}

window.addEventListener('focus',setCalendarRanges,{passive:true});
document.addEventListener('visibilitychange',function(){
  if(!document.hidden){setCalendarRanges();}
});
window.addEventListener('resize',function(){setCalendarRanges();},{passive:true});

function go(target){
  if(target==='quotes'){location.href='index.html'}
  else if(target==='dashboard'){location.href='dashboard.html'}
  else{location.href=target+'.html'}
}

/* Initial session bootstrap: render the current trading day immediately.
   The summary starts at fresh deposit/zero P&L and the replay then grows it
   trade-by-trade. */
setCalendarRanges();
setTodayMode();

document.querySelectorAll('.nav-item[role="button"]').forEach(function(item){
  item.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){
      e.preventDefault();
      item.click();
    }
  });
});


let lastDeviceDayKey=localDateKey();
setInterval(function(){
  const nowKey=localDateKey();
  if(nowKey===lastDeviceDayKey) return;
  lastDeviceDayKey=nowKey;

  /* 24-hour calendar rollover: new day -> fresh deterministic deposit,
     adaptive trades and the next daily-compounding target. There are no withdrawals. */
  if(document.visibilityState!=='hidden'){
    setCalendarRanges();
    const today=startOfDay(new Date());
    const rows=buildDataset(today,today);
    document.querySelectorAll('.date-option').forEach(function(option){
      option.classList.toggle('selected',option.dataset.period==='Today');
    });
    refreshDailySummary(today,rows);
    animateReplay(rows);
  }
},1000);

document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    closeDateMenu();
    closeCustomPeriod();
  }
});

<script>
/* Production drawer controls — isolated from History and Calendar. */
(function(){
  const root=document.getElementById('aethronDrawerRoot');
  const panel=document.getElementById('aethronDrawerPanel');
  const scrim=document.getElementById('aethronDrawerScrim');
  const menu=document.getElementById('dashboardHamburger');
  if(!root||!panel||!scrim||!menu) return;

  function openDrawer(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    const dm=document.getElementById('dateMenu');
    const db=document.getElementById('dateMenuBackdrop');
    const dr=document.getElementById('dateOverlayRoot');
    if(dm) dm.classList.remove('open');
    if(db) db.classList.remove('open');
    if(dr){ dr.classList.remove('open'); dr.setAttribute('aria-hidden','true'); }
    root.classList.add('open');
    root.setAttribute('aria-hidden','false');
  }
  function closeDrawer(e){
    if(e){ e.preventDefault(); e.stopPropagation(); }
    root.classList.remove('open');
    root.setAttribute('aria-hidden','true');
  }

  window.openDrawer=openDrawer;
  window.closeDrawer=closeDrawer;

  menu.addEventListener('click',openDrawer);
  menu.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDrawer(e); }
  });

  scrim.addEventListener('click',closeDrawer);
  scrim.addEventListener('pointerup',closeDrawer);
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeDrawer(e); });
  function handleOrientationChange(){
    closeDrawer();
    closeDateMenu();
  }
  window.addEventListener('orientationchange',handleOrientationChange,{passive:true});
  window.addEventListener('orientationchange',function(){setTimeout(function(){
    const evt=new Event('resize'); window.dispatchEvent(evt);
  },120)},{passive:true});
  handleOrientationChange();
})();
</script>
